[package]
name = "rust_quest"
version = "0.1.0"
edition = "2021"
description = "RustQuest — apprends le Rust de façon ludique, par niveaux et exercices"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
base64 = "0.22"

# Utilisé uniquement sur les systèmes Unix pour limiter les ressources du code
# exécuté (setrlimit). Sans effet (et non compilé) sur les autres plateformes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 0
