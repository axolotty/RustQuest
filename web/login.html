<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — RustQuest</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text x=%228%22 y=%2252%22 font-size=%2248%22>%F0%9F%A6%80</text></svg>">
    <style>
        :root {
            --rust: #e06b30; --rust-bright: #ff8a4c; --rust-dim: #b85528;
            --bg: #1a1410; --bg-card: #2c221a; --border: #3a2e23;
            --text: #f3ece4; --text-dim: #b3a698; --red: #e0524d; --code-bg: #14100c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% -10%, #2a201a, #1a1410 55%);
            color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%; max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px 30px 34px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
        }
        .lang-toggle {
            display: flex; width: fit-content; margin: 0 auto 18px;
            background: var(--code-bg); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden;
        }
        .lang-toggle button {
            background: transparent; border: none; color: var(--text-dim);
            padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .lang-toggle button.active { background: var(--rust); color: #fff; }
        .logo { font-size: 52px; text-align: center; line-height: 1; }
        h1 { text-align: center; font-size: 24px; margin: 10px 0 4px; letter-spacing: .5px; }
        .sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
        label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
        input {
            width: 100%;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color .15s;
        }
        input:focus { border-color: var(--rust); }
        button.submit {
            width: 100%; margin-top: 24px;
            background: linear-gradient(135deg, var(--rust), var(--rust-dim));
            color: #fff; border: none; border-radius: 10px;
            padding: 13px; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: filter .15s;
        }
        button.submit:hover { filter: brightness(1.08); }
        button.submit:disabled { opacity: .6; cursor: wait; }
        .error {
            display: none;
            margin-top: 16px;
            background: rgba(224, 82, 77, .1);
            border: 1px solid var(--red);
            color: #f2a9a6;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px; text-align: center;
        }
        .error.show { display: block; }
        .foot { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 24px; }
    </style>
</head>
<body>
    <form class="card" id="form">
        <div class="lang-toggle" id="lang-toggle">
            <button type="button" data-lang="fr" class="active">FR</button>
            <button type="button" data-lang="en">EN</button>
        </div>

        <div class="logo">🦀</div>
        <h1>RustQuest</h1>
        <div class="sub" id="sub"></div>

        <label for="user" id="lbl-user"></label>
        <input id="user" name="user" autocomplete="username" autofocus required>

        <label for="password" id="lbl-pass"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="submit" id="submit"></button>

        <div class="error" id="error"></div>
        <div class="foot" id="foot"></div>
    </form>

    <script>
        const I18N = {
            fr: {
                sub: "Connecte-toi pour continuer ton aventure",
                user: "Identifiant",
                password: "Mot de passe",
                login: "Se connecter",
                connecting: "Connexion…",
                error: "Identifiant ou mot de passe incorrect.",
                foot: "Apprends le Rust, niveau par niveau 🦀",
            },
            en: {
                sub: "Log in to continue your adventure",
                user: "Username",
                password: "Password",
                login: "Log in",
                connecting: "Logging in…",
                error: "Incorrect username or password.",
                foot: "Learn Rust, level by level 🦀",
            },
        };

        let lang = localStorage.getItem("rustquest_lang") === "en" ? "en" : "fr";

        const $ = (id) => document.getElementById(id);

        function applyLang(l) {
            lang = l;
            localStorage.setItem("rustquest_lang", lang);
            document.documentElement.lang = lang;
            const T = I18N[lang];
            $("sub").textContent = T.sub;
            $("lbl-user").textContent = T.user;
            $("lbl-pass").textContent = T.password;
            $("submit").textContent = T.login;
            $("error").textContent = T.error;
            $("foot").textContent = T.foot;
            document.querySelectorAll("#lang-toggle button").forEach((b) =>
                b.classList.toggle("active", b.dataset.lang === lang)
            );
        }

        document.querySelectorAll("#lang-toggle button").forEach((b) =>
            b.addEventListener("click", () => applyLang(b.dataset.lang))
        );

        const form = $("form");
        const err = $("error");
        const btn = $("submit");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            err.classList.remove("show");
            btn.disabled = true;
            btn.textContent = I18N[lang].connecting;
            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user: $("user").value,
                        password: $("password").value,
                    }),
                });
                if (res.ok) {
                    window.location.href = "/";
                    return;
                }
                err.classList.add("show");
            } catch (_) {
                err.classList.add("show");
            }
            btn.disabled = false;
            btn.textContent = I18N[lang].login;
        });

        applyLang(lang);
    </script>
</body>
</html>
