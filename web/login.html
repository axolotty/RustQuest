<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — RustQuest</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text x=%228%22 y=%2252%22 font-size=%2248%22>%F0%9F%A6%80</text></svg>">
    <style>
        :root {
            --rust: #e06b30; --rust-bright: #ff8a4c; --rust-dim: #b85528;
            --bg: #1a1410; --bg-card: #2c221a; --border: #3a2e23;
            --text: #f3ece4; --text-dim: #b3a698; --red: #e0524d; --code-bg: #14100c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% -10%, #2a201a, #1a1410 55%);
            color: var(--text);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%; max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 34px 30px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .55);
        }
        .logo { font-size: 52px; text-align: center; line-height: 1; }
        h1 { text-align: center; font-size: 24px; margin: 10px 0 4px; letter-spacing: .5px; }
        .sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 26px; }
        label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
        input {
            width: 100%;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color .15s;
        }
        input:focus { border-color: var(--rust); }
        button {
            width: 100%; margin-top: 24px;
            background: linear-gradient(135deg, var(--rust), var(--rust-dim));
            color: #fff; border: none; border-radius: 10px;
            padding: 13px; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: filter .15s;
        }
        button:hover { filter: brightness(1.08); }
        button:disabled { opacity: .6; cursor: wait; }
        .error {
            display: none;
            margin-top: 16px;
            background: rgba(224, 82, 77, .1);
            border: 1px solid var(--red);
            color: #f2a9a6;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px; text-align: center;
        }
        .error.show { display: block; }
        .foot { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 24px; }
    </style>
</head>
<body>
    <form class="card" id="form">
        <div class="logo">🦀</div>
        <h1>RustQuest</h1>
        <div class="sub">Connecte-toi pour continuer ton aventure</div>

        <label for="user">Identifiant</label>
        <input id="user" name="user" autocomplete="username" autofocus required>

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" id="submit">Se connecter</button>

        <div class="error" id="error">Identifiant ou mot de passe incorrect.</div>
        <div class="foot">Apprends le Rust, niveau par niveau 🦀</div>
    </form>

    <script>
        const form = document.getElementById("form");
        const err = document.getElementById("error");
        const btn = document.getElementById("submit");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            err.classList.remove("show");
            btn.disabled = true;
            btn.textContent = "Connexion…";
            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user: document.getElementById("user").value,
                        password: document.getElementById("password").value,
                    }),
                });
                if (res.ok) {
                    window.location.href = "/";
                    return;
                }
                err.classList.add("show");
            } catch (_) {
                err.classList.add("show");
            }
            btn.disabled = false;
            btn.textContent = "Se connecter";
        });
    </script>
</body>
</html>
