name: Scan sécurité (image Docker)

on:
  schedule:
    - cron: "0 6 * * 1"   # tous les lundis à 06:00 UTC
  workflow_dispatch: {}    # déclenchement manuel depuis l'onglet Actions
  push:
    branches: [main]
    paths:                 # rescanne dès qu'un de ces fichiers change
      - "Dockerfile"
      - "Cargo.lock"
      - ".github/workflows/security-scan.yml"

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Construire l'image & scanner (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Construire l'image Docker
        run: docker build -t rustquest:scan .

      - name: Rapport Trivy complet (informatif)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              rustquest:scan || true

      - name: Alerte si CVE CORRIGEABLES (échoue → e-mail)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              rustquest:scan
