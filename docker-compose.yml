# =============================================================================
# RustQuest — déploiement Docker
#
#   docker compose up -d --build
#
# Deux services :
#   - rustquest : l'application (auth HTTP Basic activée via .env)
#   - caddy     : reverse proxy + HTTPS auto — OPTIONNEL (profil "caddy")
#
# Caddy ne démarre QUE si COMPOSE_PROFILES=caddy dans le .env.
#   - Tu n'as pas de reverse proxy        -> COMPOSE_PROFILES=caddy (Caddy gère le HTTPS)
#   - Tu as DÉJÀ un reverse proxy en place -> COMPOSE_PROFILES=      (Caddy ignoré ;
#                                             ton proxy tape sur 127.0.0.1:${RUSTQUEST_PORT})
#
# Copie d'abord .env.example vers .env et remplis-le (surtout le mot de passe).
# =============================================================================

services:
  rustquest:
    build: .
    image: rustquest:latest
    restart: unless-stopped
    env_file: .env
    environment:
      RUSTQUEST_BIND: "0.0.0.0:3000"
    # Port publié côté hôte, lié à 127.0.0.1 par défaut (donc PAS exposé
    # directement à Internet) : ton reverse proxy externe tape dessus.
    # Avec Caddy, la communication passe par le réseau interne, ce port reste
    # juste accessible en local. Mets "0.0.0.0:..." si tu sais ce que tu fais.
    ports:
      - "0.0.0.0:${RUSTQUEST_PORT:-3000}:3000"
    volumes:
      - rustquest_data:/data
    # L'image (rust:slim) n'a ni curl ni wget : la sonde utilise le /dev/tcp de
    # bash, déjà présent, et attend un 200 sur /login (page servie sans être
    # connecté, donc représentative même avec l'auth activée).
    healthcheck:
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /login HTTP/1.1\\r\\nHost: healthcheck\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      # Réseau INTERNE uniquement (internal: true) : le code compilé/exécuté par
      # l'apprenant n'a AUCUN accès sortant vers Internet (anti exfiltration /
      # SSRF / mineur). Les ports publiés (inbound) restent joignables.
      - interne
    # --- Garde-fous de sécurité (sandbox du code exécuté) ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256          # empêche les fork bombs
    mem_limit: 2g            # plafond mémoire (compilation rustc + tmpfs comprise)
    cpus: 1.5                # plafond CPU
    # Racine du conteneur en LECTURE SEULE. Seuls /data (volume), /tmp et
    # /home/rustquest (tmpfs ci-dessous) sont inscriptibles. rustc/clippy
    # écrivent leurs fichiers intermédiaires dans /tmp, donc la compilation
    # reste fonctionnelle.
    read_only: true
    tmpfs:
      # `exec` est INDISPENSABLE : on exécute le binaire compilé depuis /tmp.
      # (Docker monte les tmpfs en `noexec` par défaut → sinon "Permission
      # denied (os error 13)" au lancement du code de l'apprenant.)
      - /tmp:exec,size=256m,mode=1777   # compilation/exécution en mémoire, taille limitée
      # HOME inscriptible pour les caches éventuels de la toolchain Rust.
      # uid/gid = ceux de l'utilisateur rustquest (10001) sinon le tmpfs est
      # monté root:root et l'utilisateur ne peut pas y écrire.
      - /home/rustquest:size=16m,mode=0700,uid=10001,gid=10001

  caddy:
    image: caddy:2
    restart: unless-stopped
    # Service optionnel : activé uniquement si COMPOSE_PROFILES=caddy.
    profiles:
      - caddy
    depends_on:
      - rustquest
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      # Caddy joint les DEUX réseaux : "interne" pour atteindre rustquest,
      # "externe" pour son propre accès Internet (Let's Encrypt / ACME).
      - interne
      - externe

networks:
  # Réseau confiné : le masquerade NAT est DÉSACTIVÉ, donc le trafic sortant du
  # conteneur vers Internet n'est pas SNAT'é et n'a pas de chemin de retour →
  # egress effectivement bloqué (anti exfiltration / SSRF / mineur). Les ports
  # PUBLIÉS (inbound, via DNAT côté hôte) continuent eux de fonctionner, donc le
  # reverse proxy externe joint toujours rustquest. (Contrairement à
  # `internal: true`, qui supprimerait carrément la publication de ports.)
  interne:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Réseau classique avec accès Internet, réservé à Caddy (ACME/HTTPS) quand le
  # profil caddy est activé.
  externe:
    driver: bridge

volumes:
  rustquest_data:
  caddy_data:
  caddy_config:
